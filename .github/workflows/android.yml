name: Android APK

on:
  push:
    branches:
      - "feature/android-desktop-apk"
  pull_request:
    branches:
      - "feature/android-desktop-apk"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testes e APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # setup-android@v3 falhou ao instalar cmdline-tools (run 45308875600). Usa-se o SDK já
      # instalado no runner e instala-se só o necessário: platform 35 e build-tools 35.0.0.
      - name: Configurar Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado em $SDK/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Testes unitários
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      # Conta os casos a partir dos relatórios XML do Gradle, não do texto do log.
      - name: Resumo dos testes unitários
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, sys
          import xml.etree.ElementTree as ET

          files = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          if not files:
              print("Nenhum relatório de teste encontrado: os testes não rodaram.")
              sys.exit(1)

          total = failed = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              total += int(root.get("tests", 0))
              failed += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
          passed = total - failed - errors - skipped

          lines = [
              "### Testes unitários",
              f"- Executados: **{total}**",
              f"- Passaram: **{passed}**",
              f"- Falharam: **{failed}**",
              f"- Com erro: **{errors}**",
              f"- Ignorados: **{skipped}**",
          ]
          text = "\n".join(lines)
          print(text)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(text + "\n")
          if failed or errors:
              sys.exit(1)
          PY

      - name: Android Lint (debug)
        run: gradle :app:lintDebug --no-daemon --stacktrace

      - name: Compilar APK debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Compilar APK release (somente se o keystore estiver nos secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Keystore não configurado: release não gerado. Debug continua disponível."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks" gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Gerar SHA-256 e relatório de tamanhos
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -print0 | while IFS= read -r -d '' apk; do
            sha256sum "$apk" | tee -a dist/SHA256SUMS.txt
            du -h "$apk" | tee -a dist/SIZES.txt
          done
          cat dist/SHA256SUMS.txt || echo "Nenhum APK encontrado."

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: desktop-env-apk
          path: |
            app/build/outputs/apk/**/*.apk
            dist/SHA256SUMS.txt
            dist/SIZES.txt
          if-no-files-found: error
          retention-days: 14

      # Relatório do Lint é publicado mesmo quando o Lint falha, para permitir a análise.
      - name: Publicar relatório do Lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14
